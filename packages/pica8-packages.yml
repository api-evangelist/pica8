  Registry queries against registry.npmjs.org, pypi.org, galaxy.ansible.com, rubygems.org and crates.io, plus the
  Pica8 GitHub organisation (https://github.com/pica8) via api.github.com, probed 2026-08-26
summary:
  official_client_libraries: 0
  registry_published_packages: 0
  first_party_repositories: 6
  finding: >-
    Pica8 publishes NO client SDK for the AmpCon REST API, in any language, in any package registry. Every
    unauthenticated registry was queried by name on 2026-08-26: npm has no `pica8` and no `ampcon` package,
    PyPI has no `pica8` package (the PyPI project named `picos` is an unrelated convex-optimization library and
    is NOT Pica8's), Ansible Galaxy has no `pica8` namespace, and the two Galaxy collections whose contents
    mention `picos_config` belong to third-party namespaces, not to Pica8. What Pica8 does distribute is source:
    six public GitHub repositories of automation content - Ansible playbooks, Jinja2 configuration templates,
    AmpCon automation scripts and an SNMP OID adapter. None is tagged, released or versioned; a consumer clones a
    branch. Because there is no release, there is no version and no publication date to read, and the currency
    signal available is the last commit.
