apis:
- name: PICOS RESTCONF / NETCONF / gNMI Device API
  description: >-
    Standards-based on-device programmability in the PICOS network operating system. RESTCONF (RFC 8040)
    exposes OPTIONS/HEAD/GET/POST/PATCH/PUT/DELETE over YANG-modelled configuration and state at /restconf/data
    with application/yang-data+json and application/yang-data+xml encodings and HTTP Basic authentication.
    NETCONF (RFC 6241) supports get, get-config, get-schema (RFC 6022) and edit-config over the same YANG
    modules shipped in /pica/etc/common/data-models. gNMI over gRPC provides dial-in Get and Subscribe
    telemetry with the switch acting as gRPC server.
  humanURL: >-
    https://pica8-fs.atlassian.net/wiki/spaces/Picos48white/pages/1157576048/RESTCONF+Configuration
  baseURL: https://{device-ip}:{restconf-port}/restconf
  tags:
  - RESTCONF
  - NETCONF
  - Telemetry
  - Network Operating System
  - Network Automation
  - YANG
  tags_raw:
  - restconf
  - netconf
  - telemetry
