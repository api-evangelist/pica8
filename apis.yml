aid: pica8
name: Pica8
description: >-
  Pica8 is a Palo Alto, California open-networking software company, first to market with a commercial
  SDN network operating system in 2012. It publishes PICOS, a Debian-Linux-based network operating system
  that runs on third-party white-box and brite-box switches (Edgecore, UfiSpace, FS and others), and
  AmpCon, a centralized controller that automates zero-touch provisioning, configuration templating,
  image upgrade, licensing and Ansible playbook execution across a fleet of PICOS switches. PICOS exposes
  standards-based programmatic interfaces on the device itself - RESTCONF over YANG-modelled datastores,
  NETCONF with get/get-config/get-schema/edit-config, gNMI-over-gRPC streaming telemetry, sFlow v5,
  OpenFlow 1.3/1.4 and OVSDB in CrossFlow mode - while AmpCon exposes a JWT-authenticated JSON REST API
  covering templates, global and per-switch configuration, backup and rollback, switch lifecycle
  (stage/import/DECOM/RMA/upgrade), grouping, licensing, settings and Ansible playbooks and jobs. Both
  are customer-deployed: there is no Pica8-hosted API endpoint, so every base URL is the operator's own
  controller or switch address.
