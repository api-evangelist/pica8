apis:
  - name: Pica8 AmpCon Network Controller API
    description: >-
      JSON REST API on the customer-deployed AmpCon controller. A JWT bearer token is minted from
      POST /token by a superadmin user and carried in the Authorization header on every call. The API
      covers Jinja2 configuration templates, global and per-switch (site) configuration generation,
      configuration backup / restore / diff, switch lifecycle (stage, import, DECOM, RMA, upgrade),
      switch groups and group-scoped licensing actions, controller settings and user administration,
      and Ansible playbook and job management.
    humanURL: https://pica8-fs.atlassian.net/wiki/spaces/ampcon/pages/753668/AmpCon+API+document
    baseURL: https://{ampcon-server-ip}/
    tags:
      - Network Automation
      - Network Management
      - Open Networking
      - Configuration Management
      - Provisioning
    tags_raw:
