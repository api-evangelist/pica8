  /api/settings/update_user:
    get:
      operationId: updateAmpConUser
      summary: Update AmpCon login user
      description: 'Updates an AmpCon user: password, role (`readonly`, `operator`, `admin`, `superadmin`), email and scope.
        `user_type` selects a `group`- or `global`-scoped user; `group_name` is required when `user_type` is `group`. Support
        for specifying the user type was added in the 2023-06-25 revision. NOTE: the published document records the method
        for this call as GET while also specifying a JSON request body — that inconsistency is in Pica8''s document and has
        not been altered here.'
      tags:
      - Settings
      responses:
        '200':
          description: Success. AmpCon returns a message plus a status/status_code field in the body; the HTTP status line
            is not the primary error signal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  status_code:
                    type: integer
                  status:
                    type: integer
                  info:
                    type: string
                  message:
                    type: string
              example:
                info: update user success
                status: '200'
        '400':
          description: Documented error response. AmpCon reports the failure in the body (`status` / `status_code` of 400
            or 500) alongside a human-readable message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  status_code:
                    type: integer
                  status:
                    type: integer
                  info:
                    type: string
                  message:
                    type: string
              example:
                msg: <ERROR msg from backend>
                status: '400'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                user_type:
                  type: string
                  enum:
                  - group
                  - global
                group_name:
                  type: string
                type:
                  type: string
                  enum:
                  - readonly
                  - operator
                  - admin
                  - superadmin
                email:
                  type: string
              required:
              - username
            example:
              username: <ampcon-login-user>
              password: <password>
              user_type: group
              group_name: group1,group2,group3
              type: operator
              email: <email-string>
