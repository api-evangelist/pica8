what_is_published:
  model: >-
    Pica8 describes a "Simple, Single License" model in prose: one license covers the AmpCon Network Controller
    plus blocks of PicOS software, is perpetual ("You buy it once, run it anywhere, swapping hardware as you need
    ... forever"), and carries no port-count or performance restriction across PoE, multi-gig, 1G, 25G and 100G
    switches. Subscription licenses and speed-class licenses (S25G, S40G, 400G) exist as AmpCon deployment options
    per the 1.11.0 release notes, but none is priced publicly.
