  detail: >-
    The AmpCon REST API carries no version identifier on the wire. Its contract version is the AmpCon product
    version, and each revision of the contract is published as a separate dated Word attachment on one wiki page.
    Four revisions are published: "AmpCon API document.docx" (versions before 1.9.0), 1.9.0 (2022-10-28),
    1.10.0 (2023-01-18) and 1.12.0 (2023-06-25).
  gap: >-
    The newest published API document is 1.12.0 / AmpCon 1.12.1, dated 2023-06-25, while the AmpCon product has
    shipped through 1.13.0, 1.13.1, 1.14.0 and 1.14.1 since. Whatever API changes those four releases carried are
    not reflected in any published contract. Two further product lines (AmpCon-DC, AmpCon-Campus) have their own
    user guides and no published API document at all.
