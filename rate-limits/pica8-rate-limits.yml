finding: >-
  No rate limit is published for any Pica8 API. The AmpCon API document - which does enumerate every error
  response per operation - contains no 429, no quota, no throttle and no Retry-After anywhere in its 58 pages, and
  the PICOS RESTCONF documentation states no limit either. This is consistent with the deployment model: both
  APIs run on hardware the operator owns, so there is no shared multi-tenant capacity for Pica8 to ration. The
  practical limits are the controller VM's own capacity and the switch's management-plane CPU, neither of which
  Pica8 quantifies.
