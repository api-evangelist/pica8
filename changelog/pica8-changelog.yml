  - 'Fixed inability to reset MySQL/RabbitMQ passwords more than once during system setup (ticket 856).'
  - 'Fixed MD5 file being ignored when uploaded alongside an image file (ticket 862).'
  - 'Support uploading empty parking lot security / initial security configurations for ZTP (ticket 863).'
