- version: 1.12.1
  date: '2023-06-25'
  date_source: AmpCon API document revision date; the release note itself is undated
  type: patch
  breaking: false
  api_affecting: true
  highlights:
  - 'New hardware support: AS4625-54T, AS4625-54P, with a 4.4.1 CLI tree update.'
  - 'Improved AmpCon role-based access control (RBAC).'
  - 'Improved password security policy with manual and automatic user lock/unlock.'
  - 'API FIX (ticket 857): JWT tokens read as invalid because requests were routed to different backend instances.'
  - 'Fixed TACACS+ user chown failure on the pushed security file during deployment (ticket 868).'
  - 'Fixed DECOM error when using local licenses (ticket 847).'
  - 'Fixed PICOS VLAN member configuration being merged in show configuration output, which failed full configuration validation (ticket 864).'
